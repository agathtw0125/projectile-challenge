<script>

/* ===================== 題目資料 ===================== */
/* 公式以 TeX 撰寫：行內 \( … \)，直式（分行對齊）\[ \begin{aligned} … \end{aligned} \] */
const M = String.raw;
const qSteel = {
  tag:'自由落體', title:'鋼珠自由落下',
  stem:'某同學在實驗中將一鋼珠自距離地面 <b>20 公尺</b>高度由<b>靜止</b>自由釋放。若忽略空氣阻力且取 g = 10 m/s²，試問鋼珠自釋放至著地共歷時幾秒？著地瞬間的速度大小為何？',
  options:['歷時 2 秒，著地速度 20 m/s','歷時 2 秒，著地速度 10 m/s','歷時 4 秒，著地速度 20 m/s','歷時 4 秒，著地速度 40 m/s'], ans:0,
  optFb:{1:M`時間沒問題的話，再檢查速度：速度公式 \(v = v_0 + gt\) 裡面有沒有 \(\dfrac{1}{2}\)？`,2:M`4 是 \(t^2\) 還是 \(t\)？記得最後要開根號。`,3:M`時間和速度都再對一次：\(20 = \dfrac{1}{2} \times 10 \times t^2\)，\(t^2\) 是多少？\(t\) 呢？`},
  steps:[
    {t:'mc',q:'題目說「由靜止釋放」，這告訴我們什麼？',c:[M`初速度 \(v_0 = 0\)`,M`加速度 \(a = 0\)`,'鋼珠的速度一直是 0'],a:0,h:{1:'釋放後鋼珠越落越快，速度在改變，加速度不可能是 0。',2:'如果速度一直是 0，鋼珠就會停在空中了。「靜止」只描述「開始那一刻」。'},ok:'「靜止」只說明出發瞬間速度為 0。'},
    {t:'mc',q:M`已知高度 \(h\)、\(g\)、\(v_0 = 0\)，想先求「時間 \(t\)」，選哪一條式子最直接？`,c:[M`\(h = \dfrac{1}{2} g t^2\)`,M`\(v = g t\)`,M`\(v^2 = 2 g h\)`],a:0,h:{1:M`這條式子要先知道末速度 \(v\)，我們還不知道。`,2:M`這條式子裡沒有 \(t\)，求不出時間。`},ok:M`式子裡已知 \(h\)、\(g\)，只剩 \(t\) 未知。`},
    {t:'num',q:M`代入：\(20 = \dfrac{1}{2} \times 10 \times t^2\)，則 \(t^2\) = ？`,a:4,u:'s²',h:M`先算 \(\dfrac{1}{2} \times 10 = 5\)，所以 \(20 = 5t^2\)。`,ok:M`接著別忘了 \(t^2\) 不是 \(t\)。`},
    {t:'num',q:M`所以 \(t\) = ？`,a:2,u:'s',h:'哪個正數平方後會等於上一步的結果？時間只取正值。',ok:'時間求出來了。'},
    {t:'num',q:M`著地速度 \(v = v_0 + g t\) = ？`,a:20,u:'m/s',h:M`\(v_0 = 0\)，\(g = 10\)，\(t\) 用上一步的結果。`,ok:M`也可以用 \(v^2 = 2gh\) 驗算看看是否一樣。`},
  ],
  sim:{type:'fall',h:20,v0:0,strobe:0.5},
  dg:{kind:'drop',h:'h = 20 m',v0:'v₀ = 0',ask:['t = ?','v = ?']},
  sol:M`<p>取向下為正，\(v_0 = 0\)、\(a = g = 10\ \text{m/s}^2\)。</p>
<div class="eqs">\[\begin{aligned} h &= \dfrac{1}{2} g t^2 \\ 20 &= \dfrac{1}{2} \times 10 \times t^2 \\ t^2 &= 4 \\ t &= 2\ \text{s} \end{aligned}\]</div>
<div class="eqs">\[\begin{aligned} v &= v_0 + g t \\ &= 0 + 10 \times 2 \\ &= 20\ \text{m/s} \end{aligned}\]</div>
<p class="eqlab">驗算</p><div class="eqs">\[\begin{aligned} v^2 &= 2gh = 2 \times 10 \times 20 = 400 \\ v &= 20\ \text{m/s} \end{aligned}\]</div>
<p>答案 <span class="ans">(A)</span>。常見錯誤：(B) 把速度算成 \(\dfrac{1}{2}gt\)；(C) 把 \(t^2 = 4\) 當成 \(t\)。</p>`
};

const GROUPS = [
{ id:1, name:'第 1 組', members:'',
  qs:[ qSteel,
  { tag:'斜向拋射', title:'足球斜踢',
    stem:M`足球員在草地上將足球以初速度 <b>20 m/s</b>、仰角 <b>45°</b> 斜向踢出。若取 g = 10 m/s²，忽略空氣阻力，已知 \(\sin 45^\circ = \cos 45^\circ = \dfrac{\sqrt{2}}{2}\)，試求此足球在空中所能達到的最大高度與水平射程分別為何？`,
    note:M`原學習單中的數字符號在送出時遺失，依選項還原為 \(v_0 = 20\) m/s、\(\theta = 45^\circ\)。`,
    options:['最大高度 10 公尺，水平射程 40 公尺','最大高度 5 公尺，水平射程 20 公尺','最大高度 5 公尺，水平射程 10 公尺','最大高度 20 公尺，水平射程 80 公尺'], ans:0,
    optFb:{1:M`兩個數字剛好都是某組答案的一半，回頭檢查 \(v_y^{\,2}\) 有沒有算對。`,2:'射程要用「整段飛行時間」乘水平速度，不是只用上升時間。',3:M`最大高度公式的分母是 \(2g\)，不是 \(g\)。`},
    steps:[

/* ===================== 模擬 ===================== */
const G10=10;
function model(c){
  if(c.type==='fall'||c.type==='proj'){
    const th=c.type==='proj'?c.ang*Math.PI/180:Math.PI/2, vx=c.type==='proj'?c.v0*Math.cos(th):0, vy=c.type==='proj'?c.v0*Math.sin(th):c.v0;
    const T=(vy+Math.sqrt(vy*vy+2*G10*c.h))/G10;
    const ymax=c.h+(vy>0?vy*vy/(2*G10):0);
    return {T,vy0:vy,vx0:vx,bodies:t=>[{x:vx*t,y:c.h+vy*t-5*t*t,vx,vy:vy-G10*t,ax:0,ay:-G10,col:'acc'}],xmax:vx*T,ymax};
  }
  if(c.type==='pair'){const T=Math.sqrt(2*c.h/G10);
    return {T,vy0:0,bodies:t=>[{x:0,y:c.h-5*t*t,vx:0,vy:-G10*t,ax:0,ay:-G10,col:'acc',lab:'A'},{x:c.vx*t,y:c.h-5*t*t,vx:c.vx,vy:-G10*t,ax:0,ay:-G10,col:'blue',lab:'B'}],xmax:c.vx*T,ymax:c.h};}
  if(c.type==='line'){return {T:c.T,vy0:0,bodies:t=>[{x:.5*c.a*t*t,y:0,vx:c.a*t,vy:0,ax:c.a,ay:0,col:'acc'}],xmax:.5*c.a*c.T*c.T,ymax:0};}
}

    L.push(`<div>速度 <i>v</i> = <i>at</i> = ${c.a} × ${ts} = <b>${n2(p.vx)}</b> m/s</div>`);
    const k=Math.floor(t+1e-9); if(k>=1){const x1=.5*c.a*(k-1)**2,x2=.5*c.a*k*k;
      L.push(`<div>第 ${k} 秒內位移 = <i>x</i>(${k}) − <i>x</i>(${k-1}) = ${n2(x2)} − ${n2(x1)} = <b>${n2(x2-x1)}</b> m</div>`);}
    return L.join('');
  }
  L.push(`<div class="ro-h">向上為正，<i>g</i> = 10 m/s²，<i>t</i> = ${ts} s</div>`);
  if(c.type==='pair'){
    const [A,B]=m.bodies(t);
    L.push(`<div><b class="ro-k">A、B 鉛直</b><i>y</i> = <i>h</i> − ${HALF}<i>gt</i>² = ${n2(c.h)} − ${HALF} × 10 × ${ts}² = <b>${n2(A.y)}</b> m</div>`);
    L.push(`<div><b class="ro-k">A、B 鉛直</b>${V('y')} = −<i>gt</i> = −10 × ${ts} = <b>${n2(A.vy)}</b> m/s</div>`);
    L.push(`<div><b class="ro-k">B 水平</b><i>x</i> = ${V('0x')}<i>t</i> = ${n2(c.vx)} × ${ts} = <b>${n2(B.x)}</b> m，${V('x')} = ${V('0x')} = ${n2(c.vx)} m/s</div>`);
    L.push(`<div><b class="ro-k">速率</b><i>v</i><sub>A</sub> = |${V('y')}| = <b>${n2(Math.abs(A.vy))}</b> m/s；<i>v</i><sub>B</sub> = √(${V('x')}² + ${V('y')}²) = √(${n2(c.vx)}² + ${par(B.vy)}²) = <b>${n2(Math.hypot(B.vx,B.vy))}</b> m/s</div>`);
    return L.join('');
  }
  const p=m.bodies(t)[0], vx0=m.vx0, vy0=m.vy0, h=c.h, horiz=c.type==='proj';
  if(horiz) L.push(`<div><b class="ro-k">水平</b><i>x</i> = ${V('0x')}<i>t</i> = ${n2(vx0)} × ${ts} = <b>${n2(p.x)}</b> m</div>`);
  const fy=(h?'<i>h</i> + ':'')+(vy0?`${V('0y')}<i>t</i> − `:'− ')+`${HALF}<i>gt</i>²`;
  const sy=(h?`${n2(h)} + `:'')+(vy0?`${par(vy0)} × ${ts} − `:'− ')+`${HALF} × 10 × ${ts}²`;
  L.push(`<div><b class="ro-k">鉛直</b><i>y</i> = ${fy} = ${sy} = <b>${n2(p.y)}</b> m</div>`);
  if(horiz) L.push(`<div><b class="ro-k">水平</b>${V('x')} = ${V('0x')} = <b>${n2(vx0)}</b> m/s（水平不受力，速度不變）</div>`);
  L.push(`<div><b class="ro-k">鉛直</b>${V('y')} = ${vy0?V('0y')+' − <i>gt</i>':'−<i>gt</i>'} = ${vy0?par(vy0)+' − ':'−'}10 × ${ts} = <b>${n2(p.vy)}</b> m/s</div>`);
  if(horiz) L.push(`<div><b class="ro-k">速率</b><i>v</i> = √(${V('x')}² + ${V('y')}²) = √(${n2(p.vx)}² + ${par(p.vy)}²) = <b>${n2(Math.hypot(p.vx,p.vy))}</b> m/s</div>`);
  if(vy0>0) L.push(`<div class="ro-note">最高點時刻 <i>t</i> = ${FR(V('0y'),'<i>g</i>')} = ${FR(n2(vy0),'10')} = ${n2(vy0/10)} s，最大高度 <i>H</i> = ${h?'<i>h</i> + ':''}${FR(V('0y')+'²','2<i>g</i>')} = <b>${n2(h+vy0*vy0/20)}</b> m</div>`);
  return L.join('');
}

class Sim{
  constructor(root,cfg){
    this.c=cfg;this.root=root;this.t=0;this.play=false;this.speed=cfg.type==='tube'?0.25:1;this.air=false;
    this.showStrobe=true;this.showVec=!!cfg.vec;this.showData=false;this.msg='';this.passed=new Set();
    root.innerHTML=`<canvas class="sim"></canvas>
      <div class="ctrls">
        <button class="btn small" data-a="play">▶ 播放</button><button class="btn small ghost" data-a="reset">⟲ 重來</button>
        <label>速度 <select data-a="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1">1×</option></select></label>
        ${cfg.type==='tube'?'<button class="btn small ghost" data-a="air">切換：真空</button>':''}
        <label><input type="checkbox" data-a="strobe" checked> 頻閃點</label>
        ${cfg.type!=='tube'?`<label><input type="checkbox" data-a="vec" ${cfg.vec?'checked':''}> 速度／加速度向量</label>`:''}
        <label><input type="checkbox" data-a="data"> 顯示讀數與算式</label>
      </div>
      <div class="simmsg" aria-live="polite"></div><div class="readout"></div>`;
    this.cv=root.querySelector('canvas');this.ctx=this.cv.getContext('2d');
    this.msgEl=root.querySelector('.simmsg');this.roEl=root.querySelector('.readout');
    root.querySelector('[data-a="speed"]').value=String(this.speed);
    if(cfg.type==='tube'){this.air=false;}
    this.m=cfg.type==='tube'?null:model(cfg);
    root.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a;
      if(k==='play'){if(this.t>=this.end())this.reset();this.toggle();}
      if(k==='reset')this.reset();
      if(k==='air'){this.air=!this.air;a.textContent=this.air?'切換：真空':'切換：有空氣';this.reset();this.setMsg(this.air?'管內有空氣':'管內為真空');}
    });
    root.addEventListener('change',e=>{const k=e.target.dataset.a;
      if(k==='speed')this.speed=+e.target.value; if(k==='strobe')this.showStrobe=e.target.checked;
      if(k==='vec')this.showVec=e.target.checked; if(k==='data')this.showData=e.target.checked; this.draw();});
    if(cfg.type==='tube'){root.querySelector('[data-a="air"]').textContent='切換：有空氣';}
    this.ro=new ResizeObserver(()=>this.fit());this.ro.observe(this.cv);
  }
  end(){if(this.c.type==='tube'){return this.air?3.2:Math.sqrt(2*1.2/G10)+0.02;}return this.m.T;}
  setMsg(s){this.msgEl.textContent=s;}
  fit(){const w=this.cv.clientWidth;if(!w)return;const h=Math.round(Math.min(Math.max(w*0.7,260),460));const dpr=window.devicePixelRatio||1;
    this.cv.style.height=h+'px';this.cv.width=w*dpr;this.cv.height=h*dpr;this.ctx.setTransform(dpr,0,0,dpr,0,0);this.W=w;this.H=h;this.draw();}
  toggle(){this.play=!this.play;this.root.querySelector('[data-a="play"]').textContent=this.play?'❚❚ 暫停':'▶ 播放';
    if(this.play){this.last=performance.now();requestAnimationFrame(n=>this.tick(n));}}
  pause(){if(this.play)this.toggle();}
  reset(){this.t=0;this.passed.clear();this.setMsg('');if(this.play)this.toggle();this.draw();}
  tick(now){if(!this.play)return;const dt=Math.min(.05,(now-this.last)/1000)*this.speed;this.last=now;
    const t0=this.t;let t1=t0+dt;const c=this.c;let stop=null;
    if(c.pauseTop&&this.m&&this.m.vy0>0){const tt=this.m.vy0/G10;if(t0<tt&&t1>=tt&&!this.passed.has('top')){this.passed.add('top');t1=tt;stop='到達最高點！觀察此刻的速度與加速度箭頭。';}}
    (c.stops||[]).forEach(s=>{if(!stop&&t0<s&&t1>=s&&!this.passed.has(s)){this.passed.add(s);t1=s;stop=`t = ${s} s，暫停觀察。`;}});
    if(c.mark&&this.m){const y0=this.m.bodies(t0)[0].y,y1=this.m.bodies(t1)[0].y;if((y0-c.mark)*(y1-c.mark)<=0&&y0!==y1){const k='m'+this.passed.size;this.passed.add(k);stop='經過 '+c.mark+' m 高度！記下這是第幾次經過。';}}
    if(t1>=this.end()){t1=this.end();this.t=t1;this.draw();this.pause();this.setMsg(c.type==='tube'?'到底了，比較兩者。':'落地！');return;}
    this.t=t1;this.draw();if(stop){this.pause();this.setMsg(stop);return;}requestAnimationFrame(n=>this.tick(n));}
  draw(){const ctx=this.ctx,W=this.W,H=this.H;if(!W)return;
    const C={bg:css('--surface'),ink:css('--ink'),mut:css('--muted'),line:css('--line'),acc:css('--accent'),blue:css('--blue'),sunk:css('--sunk')};
    ctx.clearRect(0,0,W,H);ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
    if(this.c.type==='tube')return this.drawTube(ctx,W,H,C);
    const c=this.c,m=this.m;
    // world bounds
    let xmin=0,xmax=m.xmax,ymin=0,ymax=Math.max(m.ymax,1);
    if(c.type==='line'){ymin=-1;ymax=1;}
    if(xmax-xmin<ymax*0.6){const span=Math.max(ymax*0.75,4);xmin=-span/2;xmax=span/2;}
    const bw=(c.h>0&&c.type!=='line')?Math.max((xmax-xmin)*0.18,ymax*0.18):0;
    if(c.h>0)xmin=Math.min(xmin,-bw-(xmax-xmin)*0.05);
    const pl=this.showData?48:22,pr=22,pt=28,pb=34;
    const sc=c.type==='line'?(W-pl-pr)/(xmax-xmin):Math.min((W-pl-pr)/(xmax-xmin),(H-pt-pb)/(ymax-ymin));
    const ox=pl+((W-pl-pr)-(xmax-xmin)*sc)/2-xmin*sc, oy=c.type==='line'?H*0.55:H-pb;
    const X=x=>ox+x*sc,Y=y=>oy-y*sc;
    // ground
    ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,Y(0));ctx.lineTo(W,Y(0));ctx.stroke();
    ctx.strokeStyle=C.line;ctx.lineWidth=1;for(let x=4;x<W;x+=12){ctx.beginPath();ctx.moveTo(x,Y(0));ctx.lineTo(x-7,Y(0)+7);ctx.stroke();}
    if(c.h>0&&c.type!=='line'){ctx.fillStyle=C.sunk;ctx.strokeStyle=C.line;ctx.fillRect(X(-bw)-2,Y(c.h),bw*sc-6,c.h*sc);ctx.strokeRect(X(-bw)-2,Y(c.h),bw*sc-6,c.h*sc);
      if(c.cliff){ctx.strokeStyle=C.blue;ctx.lineWidth=2;ctx.beginPath();for(let x=X(0);x<W;x+=4)ctx.lineTo(x,Y(0)-2+2*Math.sin(x/8));ctx.stroke();}}
    if(c.mark){ctx.setLineDash([6,5]);ctx.strokeStyle=C.acc;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,Y(c.mark));ctx.lineTo(W,Y(c.mark));ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=C.acc;ctx.font='600 13px '+css('--f-body');ctx.fillText(c.mark+' m',W-48,Y(c.mark)-6);}
    // ruler
    if(this.showData&&c.type!=='line'){ctx.fillStyle=C.mut;ctx.strokeStyle=C.line;ctx.font='12px '+css('--f-num');const step=ymax>60?20:ymax>25?10:5;
      for(let y=0;y<=ymax+0.01;y+=step){ctx.beginPath();ctx.moveTo(pl-6,Y(y));ctx.lineTo(W,Y(y));ctx.globalAlpha=.35;ctx.stroke();ctx.globalAlpha=1;ctx.fillText(y+'m',4,Y(y)+4);}}
    if(this.showData&&c.type==='line'){ctx.fillStyle=C.mut;ctx.font='12px '+css('--f-num');for(let x=0;x<=xmax;x+=6){ctx.fillText(x+'',X(x)-6,Y(0)+30);}ctx.fillText('m',W-16,Y(0)+30);}
    // trail
    const N=120,tt=this.t;ctx.lineWidth=1.5;
    const nb=m.bodies(0).length;
    for(let b=0;b<nb;b++){const col=m.bodies(0)[b].col==='blue'?C.blue:C.acc;ctx.strokeStyle=col;ctx.globalAlpha=.35;ctx.beginPath();
      for(let i=0;i<=N;i++){const s=tt*i/N,p=m.bodies(s)[b];i?ctx.lineTo(X(p.x),Y(p.y)):ctx.moveTo(X(p.x),Y(p.y));}ctx.stroke();ctx.globalAlpha=1;
      if(this.showStrobe){const d=c.strobe||1;for(let s=0;s<=tt+1e-9;s+=d){const p=m.bodies(s)[b];ctx.beginPath();ctx.arc(X(p.x),Y(p.y)+(c.type==='line'?22:0),4,0,7);ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.stroke();
        if(c.type==='line'){ctx.fillStyle=C.mut;ctx.font='12px '+css('--f-num');ctx.fillText(Math.round(s)+'s',X(p.x)-8,Y(p.y)+44);}}}}
    // line brackets
    if(c.type==='line'&&this.showData){ctx.fillStyle=C.acc;ctx.font='600 13px '+css('--f-num');for(let k=1;k<=Math.floor(tt+1e-9);k++){const a=.5*c.a*(k-1)**2,b2=.5*c.a*k*k;ctx.fillText((b2-a)+' m',X((a+b2)/2)-12,Y(0)-30);}}
    // bodies
    m.bodies(tt).forEach(p=>{const col=p.col==='blue'?C.blue:C.acc;
      if(c.type==='line'){ctx.fillStyle=col;ctx.fillRect(X(p.x)-14,Y(0)-20,28,18);}
      else{ctx.fillStyle=col;ctx.beginPath();ctx.arc(X(p.x),Y(p.y),8,0,7);ctx.fill();}
      if(p.lab){ctx.fillStyle=C.ink;ctx.font='700 14px '+css('--f-body');ctx.fillText(p.lab,X(p.x)-4,Y(p.y)-14);}
      if(this.showVec){const vmax=Math.max(Math.abs(m.vy0),20,Math.hypot(p.vx,p.vy)),k=H*0.2/vmax;const bx=X(p.x),by=c.type==='line'?Y(0)-11:Y(p.y);
        this.arrow(ctx,bx,by,bx+p.vx*k,by-p.vy*k,C.acc,'v');this.arrow(ctx,bx,by,bx+p.ax/Math.hypot(p.ax,p.ay)*38,by-p.ay/Math.hypot(p.ax,p.ay)*38,C.blue,'a');}});
    // readout：讀數與算式
    if(this.showData){this.roEl.innerHTML=readout(c,m,tt);}
    else this.roEl.textContent='';
  }
  arrow(ctx,x1,y1,x2,y2,col,lab){const L=Math.hypot(x2-x1,y2-y1);if(L<3)return;const a=Math.atan2(y2-y1,x2-x1);ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-9*Math.cos(a-.4),y2-9*Math.sin(a-.4));ctx.lineTo(x2-9*Math.cos(a+.4),y2-9*Math.sin(a+.4));ctx.fill();
    ctx.font='italic 700 14px '+css('--f-body');ctx.fillText(lab,x2+5,y2+(lab==='a'?12:-4));}
  drawTube(ctx,W,H,C){const L=1.2,t=this.t,top=26,bot=H-26,tw=Math.min(140,W*0.35),tx=W/2-tw/2;
    ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect?ctx.roundRect(tx,top-10,tw,bot-top+20,14):ctx.rect(tx,top-10,tw,bot-top+20);ctx.stroke();
    if(this.air){ctx.fillStyle=C.blue;ctx.globalAlpha=.12;ctx.fillRect(tx+2,top-8,tw-4,bot-top+16);ctx.globalAlpha=1;}
    const Y=y=>top+(L-y)/L*(bot-top);
    const yc=Math.max(0,L-5*t*t);let yf;
    if(this.air){const vt=0.35,k=G10/vt;yf=Math.max(0,L-vt*(t-(1-Math.exp(-k*t))/k));}else yf=yc;
    const sp=d=>{const out=[];for(let s=0;s<=t+1e-9;s+=d)out.push(s);return out;};
    if(this.showStrobe){sp(this.air?0.25:0.05).forEach(s=>{const c2=Math.max(0,L-5*s*s);let f=c2;if(this.air){const vt=.35,k=G10/vt;f=Math.max(0,L-vt*(s-(1-Math.exp(-k*s))/k));}
      ctx.lineWidth=1.3;ctx.strokeStyle=C.acc;ctx.beginPath();ctx.arc(tx+tw*0.7,Y(c2),4,0,7);ctx.stroke();ctx.strokeStyle=C.mut;ctx.beginPath();ctx.arc(tx+tw*0.3,Y(f),4,0,7);ctx.stroke();});}
    ctx.fillStyle=C.acc;ctx.beginPath();ctx.arc(tx+tw*0.7,Y(yc),9,0,7);ctx.fill();
    ctx.save();ctx.translate(tx+tw*0.3,Y(yf));ctx.rotate(-0.4+0.3*Math.sin(t*6));ctx.strokeStyle=C.ink;ctx.fillStyle=C.sunk;ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(0,0,16,5,0,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-18,0);ctx.lineTo(18,0);ctx.stroke();ctx.restore();
    ctx.fillStyle=C.ink;ctx.font='700 14px '+css('--f-body');ctx.fillText('羽毛',tx-40,top+10);ctx.fillText('錢幣',tx+tw+8,top+10);
    ctx.fillStyle=this.air?C.blue:C.mut;ctx.fillText(this.air?'有空氣':'真空',tx+tw/2-20,bot+20);
    if(this.showData){const ts=n2(t);
      this.roEl.innerHTML=`<div class="ro-h">向下為正，<i>g</i> = 10 m/s²，<i>t</i> = ${ts} s（管長 ${L} m，0.25× 慢動作）</div>`+
        `<div><b class="ro-k">錢幣</b>落下距離 <i>d</i> = ${HALF}<i>gt</i>² = ${HALF} × 10 × ${ts}² = <b>${n2(L-yc)}</b> m</div>`+
        (this.air?`<div><b class="ro-k">羽毛</b>落下距離 <b>${n2(L-yf)}</b> m（受空氣阻力，加速度越來越小，不能用 ${HALF}<i>gt</i>² 計算）</div>`
                 :`<div><b class="ro-k">羽毛</b>落下距離 <i>d</i> = ${HALF}<i>gt</i>² = ${HALF} × 10 × ${ts}² = <b>${n2(L-yf)}</b> m（真空中與錢幣相同）</div>`);}
    else this.roEl.textContent='';
  }
}

const main=document.getElementById('main'),tabs=document.getElementById('tabs');
let sims=[];
function renderTabs(cur){tabs.innerHTML=GROUPS.map(g=>{const done=[0,1,2].filter(i=>st(g.id,i).answered).length;
  return `<a href="#g${g.id}" aria-current="${g.id===cur}">${g.name}<span class="dot">${done}/3</span></a>`}).join('');}

function vt(sec){return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}

function vqr(g){const v=VIDEOS[g];return `<svg viewBox="0 0 ${v.n} ${v.n}" role="img" aria-label="第 ${g} 組解題影片 QR code" shape-rendering="crispEdges"><path fill="#000" d="${v.d}"/></svg>`}
function vlink(gid,i){const [vg,sec]=VIDEOS[gid].starts[i];
  return `<a class="vlink" href="${vurl(vg,sec)}" target="_blank" rel="noopener">▶ 解題影片${vg!==gid?`（第 ${vg} 組）`:''} ${vt(sec)}</a>`}
function videoCard(gid){const v=VIDEOS[gid];
  const same=v.starts.some(([vg])=>vg!==gid);
  return `<div class="vcard"><a class="qr" href="${v.url}" target="_blank" rel="noopener" title="開啟第 ${gid} 組解題影片">${vqr(gid)}</a>
    <div class="vtxt"><h3>第 ${gid} 組 解題影片</h3>
      <p>手機掃 QR code 或點下面的按鈕觀看。建議先自己用「引導步驟」做一次，再看影片對答案。</p>
      ${same?`<p>第 8 題與第 1 組相同，請看第 1 組影片。</p>`:''}
      <div class="vlinks">${v.starts.map(([vg,sec],i)=>`<a class="vlink" href="${vurl(vg,sec)}" target="_blank" rel="noopener">第 ${qNum[i]} 題 ${vg!==gid?`（第 ${vg} 組影片）`:''}${vt(sec)}</a>`).join('')}</div>
    </div></div>`}

function renderGroup(gid){
  sims.forEach(s=>s.ro.disconnect());sims=[];
  const g=GROUPS[gid-1];
  let h=`<div class="ghead"><div><h2>${g.name}</h2></div>
    <div class="topics">${g.qs.map((q,i)=>`<span class="chip">第 ${qNum[i]} 題 · ${q.tag}</span>`).join('')}</div></div>`;
  h+=videoCard(gid);
  g.qs.forEach((q,i)=>{h+=`<section class="q" id="q${gid}-${i}" aria-label="第 ${qNum[i]} 題">

      <div class="qhead"><span class="qno">第 ${qNum[i]} 題</span><h3>${q.title}</h3><span data-chip>${chipFor(g,i)}</span>${vlink(gid,i)}</div>

    h+=`<div class="step ${solved?'solved':'active'}" data-k="${k}"><div class="sq"><span class="n">${solved?'✓':k+1}</span><span>${p.q}</span></div>`;
    if(p.t==='mc'){const ord=(s.perm||(s.perm={}))[k]||(s.perm[k]=shuffle(p.c.map((_,j)=>j)));h+=`<div class="choices">${ord.map(j=>`<button data-j="${j}" ${solved?'disabled':''} class="${solved&&j===p.a?'right':''}">${p.c[j]}</button>`).join('')}</div>`;}
    else{h+=solved?`<div class="numrow"><span style="font-family:var(--f-num);font-weight:700;color:var(--ok)">${p.a}</span><span class="unit">${p.u}</span></div>`:`<form class="numrow" data-num><input id="in-${g.id}-${i}-${k}" type="text" inputmode="decimal" autocomplete="off" aria-label="輸入數值"><span class="unit">${p.u}</span><button class="btn small" type="submit">檢查</button></form>`;}
    h+=`<div data-fb>${solved?`<div class="fb ok">${p.ok}</div>`:''}</div></div>`;});
  const stepsDone=s.step>=q.steps.length;
  if(q.options){
    if(stepsDone||s.free||s.answered){h+=`<div class="answer"><h4>最後作答：選出你們的答案</h4><div class="choices">${q.options.map((o,k)=>{const cls=s.answered&&k===q.ans?'right':(s.wrongOpts.includes(k)?'wrong':'');return `<button data-opt="${k}" class="${cls}" ${s.answered?'disabled':''}>(${L[k]}) ${o}</button>`}).join('')}</div><div data-afb>${s.answered?'<div class="fb ok">答對了！把每一步的理由寫進學習單，詳解在本組最下方。</div>':''}</div></div>`;}
    else h+=`<div class="locked">完成全部引導步驟後開放作答。</div>`;
  } else if(stepsDone){h+=`<div class="answer"><div class="fb ok">每一小題都完成了！把算式與單位整理到學習單上，詳解在本組最下方。</div></div>`; if(!s.answered){s.answered=true;}}
  box.innerHTML=h;
  tex(box);
  sec.querySelector('[data-chip]').innerHTML=chipFor(g,i);renderTabs(g.id);

  box.onclick=e=>{
    if(e.target.closest('[data-skip]')){s.free=true;renderGuide(g,i,sec);return;}
    const ob=e.target.closest('[data-opt]');
    if(ob&&!s.answered){const k=+ob.dataset.opt,fb=box.querySelector('[data-afb]');
      if(k===q.ans){s.answered=true;renderGuide(g,i,sec);}
      else{if(!s.wrongOpts.includes(k))s.wrongOpts.push(k);ob.classList.add('wrong');fb.innerHTML=`<div class="fb hint">${q.optFb[k]||'再回頭檢查引導步驟。'}</div>`;tex(fb);}
      return;}
    const cb=e.target.closest('.step.active [data-j]');
    if(cb){const p=q.steps[s.step],j=+cb.dataset.j,fb=cb.closest('.step').querySelector('[data-fb]');
      if(j===p.a){s.step++;renderGuide(g,i,sec);focusNext(sec);}
      else{cb.classList.add('wrong');fb.innerHTML=`<div class="fb hint">${(p.h&&p.h[j])||'再想一想。'}</div>`;tex(fb);}}
  };
  box.onsubmit=e=>{e.preventDefault();const f=e.target.closest('[data-num]');if(!f)return;const p=q.steps[s.step],inp=f.querySelector('input'),fb=f.closest('.step').querySelector('[data-fb]');
    const raw=inp.value.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[－−–]/g,'-').replace(/．/g,'.').replace(/\s/g,'');
    const v=parseFloat(raw);
    if(raw===''||isNaN(v)){fb.innerHTML='<div class="fb hint">請輸入一個數字（可以有小數點或負號）。</div>';return;}
    const tol=p.tol||Math.max(0.01,Math.abs(p.a)*0.01);
    if(Math.abs(v-p.a)<=tol){s.step++;renderGuide(g,i,sec);focusNext(sec);}
    else{s.tries=(s.tries||0)+1;let msg=p.h;if(Math.abs(v+p.a)<=tol&&p.a!==0)msg='數值大小對了，正負號再想一下。'; fb.innerHTML=`<div class="fb hint">${msg}</div>`;tex(fb);inp.select();}
  };
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const r=Math.floor(Math.random()*(i+1));[a[i],a[r]]=[a[r],a[i]];}return a;}
function focusNext(sec){const n=sec.querySelector('.step.active input, .step.active button, .answer button:not(:disabled)');if(n)n.focus({preventScroll:true});}

function renderSol(g){const box=main.querySelector('[data-solbody]');
  if(!solOpen[g.id]){box.innerHTML=`<div class="locked"><span>詳解先鎖著。全組三題都討論完、寫完學習單後再打開。</span><button class="btn" data-open>打開詳解</button></div><div data-confirm></div>`;
    box.querySelector('[data-open]').onclick=()=>{box.querySelector('[data-confirm]').innerHTML=`<div class="confirm"><span>確定全組都完成推理了嗎？打開後就會看到完整答案。</span><button class="btn" data-yes>確定打開</button><button class="btn ghost" data-no>再想想</button></div>`;
      box.querySelector('[data-yes]').onclick=()=>{solOpen[g.id]=true;renderSol(g);};box.querySelector('[data-no]').onclick=()=>{box.querySelector('[data-confirm]').innerHTML='';};};
    return;}
  box.innerHTML=`<div class="sol">${g.qs.map((q,i)=>`<article><h4>第 ${qNum[i]} 題　${q.title}</h4>${q.sol}</article>`).join('')}</div>
    
    <div><button class="btn ghost small" data-close>收起詳解</button></div>`;
  box.querySelector('[data-close]').onclick=()=>{solOpen[g.id]=false;renderSol(g);};
  tex(box);
}

function route(){const m=/^#g([1-6])$/.exec(location.hash);const gid=m?+m[1]:1;renderTabs(gid);renderGroup(gid);}
window.addEventListener('hashchange',()=>{route();window.scrollTo({top:0});});
route();
</script>
